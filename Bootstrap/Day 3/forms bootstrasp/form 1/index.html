    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form - Login Form</title>
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">       
    </head>
    <body>
    <h1 class="bg-info text-white text-center fw-bold fst-italic p-4">Login Form</h1> 
    <div class="m-4">
        <form action="/examples/actions/confirmation.php" method="post">
            <div class="mb-3">
                <label for="inputEmail" class="form-label">Email</label>
                <input type="email"  id="inputEmail" class="form-control" placeholder="Email" required>
            </div>
            <div class="mb-3">
                <label for="inputPassword">Password</label>
                <input type="password"  id="inputPassword" class="form-control">
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkRemeber">
                    <label class="form-check-label" for="checkRemeber">Remember Me</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
    </div> 

        
    </body>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    </html>
